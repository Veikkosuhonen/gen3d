[package]
name = "gen3d"
version = "0.1.0"
edition = "2024"
description = "Procedural SDF shape workbench: WGSL shapes -> live preview -> mesh -> G-code"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
meshopt = "0.7.0"
naga = { version = "30.0.1", features = ["wgsl-in"] }
png = "0.18.1"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# `cargo run` without --release should still mesh at a usable speed
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
